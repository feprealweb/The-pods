<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery · The Pods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --night:#06080e; --ink:#0c1119; --panel:#111827; --line:#1d2535;
  --copper:#c27a3e; --copper-soft:#e0a46a; --cream:#f3ecdf; --glow:#ffe7b0; --muted:#8e97a9;
  --ease:cubic-bezier(.2,.7,.1,1);
  --img-night:url("images/night.jpg"); --img-bf:url("images/breakfast.jpg");
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--cream);font-family:'Outfit',system-ui,sans-serif;font-weight:300;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
input,select{background:#0a0f18;border:1px solid #2a3348;border-radius:10px;padding:.6rem .7rem;width:100%}
:focus-visible{outline:2px solid var(--copper-soft);outline-offset:3px}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}

/* NAV */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 6vw;background:linear-gradient(rgba(6,8,14,.92),rgba(6,8,14,0))}
.wordmark{font-weight:500;letter-spacing:.3em;font-size:.74rem;white-space:nowrap;background:none;border:0;cursor:default;user-select:none}
.back{font-size:.85rem;color:var(--muted);transition:color .3s}
.back:hover{color:var(--cream)}

/* HERO: title rises word by word, image drifts with scroll */
.hero{height:82vh;min-height:480px;position:relative;display:grid;place-items:end start;padding:0 6vw 9vh;overflow:hidden;isolation:isolate}
.hero-img{position:absolute;inset:-8% 0;background:var(--img-night) center 40%/cover no-repeat;z-index:-2;transform:translateY(var(--py,0px)) scale(1.08);will-change:transform}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,8,14,.25),rgba(6,8,14,.95) 90%)}
.hero .eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--copper-soft);margin-bottom:1rem;opacity:0;animation:rise 1s .2s var(--ease) forwards}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(3rem,10vw,7.5rem);line-height:.95}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(.8em);animation:rise 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*120ms + 400ms)}
.hero .sub{color:#c3c9d6;max-width:40ch;margin-top:1.2rem;opacity:0;animation:rise 1s 1.2s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero h1 .w{will-change:transform}

/* FILTERS */
.filters{position:sticky;top:0;z-index:15;display:flex;gap:.5rem;padding:1rem 6vw;background:rgba(6,8,14,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto}
.filters button{background:none;border:1px solid #2a3348;border-radius:999px;padding:.45rem 1rem;cursor:pointer;white-space:nowrap;color:var(--muted);transition:all .4s var(--ease)}
.filters button:hover{color:var(--cream)}
.filters button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:var(--night);font-weight:500}
.count{margin-left:auto;align-self:center;font-size:.8rem;color:var(--muted);white-space:nowrap}

/* GRID: masonry columns, each tile reveals as it enters view */
.grid{columns:3 280px;column-gap:14px;padding:3rem 6vw 2rem;max-width:1300px;margin:0 auto}
.tile{break-inside:avoid;margin:0 0 14px;position:relative;border-radius:18px;overflow:hidden;cursor:zoom-in;background:#0b0f18;opacity:0;transform:translateY(40px) scale(.98);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.tile.in{opacity:1;transform:none}
.tile img,.tile .ph{display:block;width:100%;height:auto}
.tile .ph{background:var(--img) center/cover no-repeat;aspect-ratio:var(--ar,4/5);transition:transform 1.4s var(--ease),filter .6s}
.tile:hover .ph{transform:scale(1.07);filter:brightness(1.08)}
.tile .shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(6,8,14,.9));opacity:0;transition:opacity .6s}
.tile:hover .shade{opacity:1}
.tile .cap{position:absolute;left:18px;right:18px;bottom:16px;font-family:'Cormorant Garamond',serif;font-size:1.35rem;line-height:1.1;transform:translateY(14px);opacity:0;transition:all .6s var(--ease)}
.tile:hover .cap{transform:none;opacity:1}
.tile .tag{position:absolute;top:12px;left:12px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;background:rgba(6,8,14,.55);border:1px solid rgba(255,255,255,.2);padding:.25rem .6rem;border-radius:999px;color:var(--cream)}
.empty{text-align:center;color:var(--muted);padding:6rem 0;column-span:all}
@media(max-width:600px){.grid{columns:2 150px;column-gap:10px}.tile{margin-bottom:10px}.hero h1{font-size:clamp(2.8rem,14vw,4.5rem)}}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.95);display:grid;place-items:center;padding:6vh 6vw}
.lb-img{width:100%;height:100%;background:center/contain no-repeat;animation:lbin .6s var(--ease)}
@keyframes lbin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lb-cap{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.4rem}
.lb button{position:absolute;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:var(--cream);border-radius:999px;width:46px;height:46px;cursor:pointer;font-size:1.3rem;transition:border-color .3s}
.lb button:hover{border-color:var(--glow)}
.lb .x{top:3vh;right:3vw}.lb .prev{left:3vw;top:50%;transform:translateY(-50%)}.lb .next{right:3vw;top:50%;transform:translateY(-50%)}

/* ADMIN */
.admin{position:fixed;inset:0;z-index:70;background:rgba(3,4,8,.85);backdrop-filter:blur(6px);display:none;overflow:auto;padding:4vh 4vw}
.admin.open{display:block}
.admin-box{max-width:880px;margin:0 auto;background:var(--panel);border:1px solid #2a3348;border-radius:22px;padding:1.6rem;position:relative}
.admin h3{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2rem;margin-bottom:.3rem}
.admin .x{position:absolute;top:1rem;right:1rem;background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.row{display:grid;grid-template-columns:90px 1.3fr 1fr .9fr .8fr auto;gap:.6rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.row img{width:90px;height:70px;object-fit:cover;border-radius:10px;background:#0b0f18}
.btn{background:none;border:1px solid #39435a;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;font-size:.88rem}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--night);font-weight:500}
.btn.danger{border-color:#6b2e2e;color:#f0a08a}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem}
.msg{color:var(--glow);font-size:.85rem}
.note{color:var(--muted);font-size:.82rem;margin-top:.6rem}
.pin{max-width:300px;margin:1.5rem auto 0;text-align:center}
.pin input{text-align:center;letter-spacing:.4em;font-size:1.2rem;margin:1rem 0}
.pinerr{color:#f0a08a;font-size:.85rem;min-height:1.2rem}
@media(max-width:700px){.row{grid-template-columns:70px 1fr;}.row select,.row input{grid-column:span 1}.row .btn{grid-column:1/-1;justify-self:start}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .tile{opacity:1;transform:none}.hero h1 .w,.hero .eyebrow,.hero .sub{opacity:1;transform:none}
}
</style>
</head>
<body>

<nav class="nav" aria-label="Gallery">
  <a class="back" href="index.html">← The Pods</a>
  <button class="wordmark" id="wordmark" aria-label="Gallery">THE PODS</button>
</nav>

<header class="hero">
  <div class="hero-img" id="heroImg" aria-hidden="true"></div>
  <div>
    <p class="eyebrow">Gallery</p>
    <h1 id="heroTitle">The pods, up close.</h1>
    <p class="sub">Glass rooms on the rooftop, the skyline after dark, and breakfast with a view.</p>
  </div>
</header>

<div class="filters" id="filters" role="group" aria-label="Filter photos"></div>
<main class="grid" id="grid"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <div class="lb-img" id="lbImg"></div>
  <p class="lb-cap" id="lbCap"></p>
  <button class="x" id="lbX" aria-label="Close">×</button>
  <button class="prev" id="lbPrev" aria-label="Previous">‹</button>
  <button class="next" id="lbNext" aria-label="Next">›</button>
</div>

<div class="admin" id="admin" role="dialog" aria-modal="true" aria-label="Owner photo manager">
  <div class="admin-box">
    <button class="x" id="adminX" aria-label="Close">×</button>
    <div id="pinGate" class="pin">
      <h3>Owner sign-in</h3>
      <p class="note">Enter the owner PIN to manage photos.</p>
      <input id="pinIn" type="password" inputmode="numeric" aria-label="PIN">
      <button class="btn primary" id="pinGo">Open</button>
      <p class="pinerr" id="pinErr"></p>
    </div>
    <div id="adminBody" hidden></div>
  </div>
</div>

<script>
const CATS = ['Pods','Food','Views'];
const DEFAULT = {
  pin: "2026",
  photos: [
    {id:'p1', src:'night', pos:'center', cat:'Pods', caption:'Rooftop pods after dark', ar:'4/5'},
    {id:'p2', src:'breakfast', pos:'center', cat:'Food', caption:'Breakfast in a pod', ar:'4/5'},
    {id:'p3', src:'night', pos:'right 70%', cat:'Views', caption:'The towers from the pods', ar:'4/3'}
  ]
};
const ownerKey = () => sessionStorage.getItem('pods-owner-key') || '';
async function api(path, opts = {}){
  const headers = {'Content-Type':'application/json'};
  if (opts.auth) headers.Authorization = 'Bearer ' + ownerKey();
  const r = await fetch(path, {method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const err = new Error(j.error || 'Request failed'); err.status = r.status; throw err; }
  return j;
}
async function persist(){
  try { await api('/api/gallery', {method:'PUT', auth:true, body: G.photos}); return true; }
  catch(e){ return false; }
}
let G = structuredClone(DEFAULT);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const imgCss = s => s==='night' ? 'var(--img-night)' : s==='breakfast' ? 'var(--img-bf)' : 'url("'+s+'")';

/* Hero title: split words for staggered rise */
$('#heroTitle').innerHTML = 'The pods, up close.'.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');

/* Filters */
let active = 'All';
function renderFilters(){
  const all = ['All', ...CATS];
  $('#filters').innerHTML = all.map(c=>`<button aria-pressed="${c===active}" data-cat="${c}">${c}</button>`).join('') +
    `<span class="count" id="count"></span>`;
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; active = b.dataset.cat; renderFilters(); renderGrid(true); });

/* Grid */
const io = new IntersectionObserver(es=>es.forEach(e=>{ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.12, rootMargin:'0px 0px -6% 0px'});
function renderGrid(animate){
  const list = G.photos.map((p,i)=>({...p, i})).filter(p => active==='All' || p.cat===active);
  $('#count').textContent = list.length + (list.length===1 ? ' photo' : ' photos');
  $('#grid').innerHTML = list.length ? list.map((p,k)=>`
    <figure class="tile" data-i="${p.i}" tabindex="0" role="button" aria-label="${esc(p.caption)}" style="transition-delay:${animate && !reduce ? (k%6)*80 : 0}ms">
      <div class="ph" style="--img:${imgCss(p.src)};background-position:${esc(p.pos||'center')};--ar:${esc(p.ar||'4/5')}"></div>
      <span class="shade"></span>
      <span class="tag">${esc(p.cat)}</span>
      <figcaption class="cap">${esc(p.caption)}</figcaption>
    </figure>`).join('') : `<p class="empty">No photos in this category yet.</p>`;
  $('#grid').querySelectorAll('.tile').forEach(el=>{
    if (reduce) el.classList.add('in'); else io.observe(el);
  });
}
$('#grid').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openLb(+t.dataset.i); });
$('#grid').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.tile')) { e.preventDefault(); openLb(+e.target.dataset.i); } });

/* Lightbox */
let lbList = [], lbPos = 0;
function visibleList(){ return G.photos.map((p,i)=>({...p,i})).filter(p => active==='All' || p.cat===active); }
function openLb(i){
  lbList = visibleList(); lbPos = Math.max(0, lbList.findIndex(p=>p.i===i));
  showLb(); $('#lb').hidden = false;
}
function showLb(){
  const p = lbList[lbPos]; if (!p) return;
  $('#lbImg').style.backgroundImage = imgCss(p.src);
  $('#lbImg').style.backgroundPosition = p.pos || 'center';
  $('#lbCap').textContent = p.caption;
}
function step(d){ lbPos = (lbPos + d + lbList.length) % lbList.length; showLb(); }
function closeLb(){ $('#lb').hidden = true; }
$('#lbX').onclick = closeLb; $('#lbPrev').onclick = ()=>step(-1); $('#lbNext').onclick = ()=>step(1);
$('#lb').addEventListener('click', e => { if (e.target.id==='lb') closeLb(); });
addEventListener('keydown', e => {
  if ($('#lb').hidden) return;
  if (e.key==='Escape') closeLb(); if (e.key==='ArrowLeft') step(-1); if (e.key==='ArrowRight') step(1);
});
let tx = null;
$('#lb').addEventListener('pointerdown', e => tx = e.clientX);
$('#lb').addEventListener('pointerup', e => { if (tx===null) return; const dx = e.clientX - tx; tx = null; if (Math.abs(dx) > 50) step(dx<0 ? 1 : -1); });

/* Hero parallax + title */
addEventListener('scroll', ()=>{
  if (reduce) return;
  const y = Math.min(scrollY, innerHeight);
  $('#heroImg').style.setProperty('--py', (y*0.35)+'px');
}, {passive:true});

/* Owner photo manager: five taps on the wordmark */
let taps = [];
$('#wordmark').addEventListener('click', ()=>{
  const now = Date.now(); taps = taps.filter(t=>now-t<2000); taps.push(now);
  if (taps.length >= 5) { taps = []; $('#admin').classList.add('open'); $('#pinGate').hidden=false; $('#adminBody').hidden=true; $('#pinIn').value=''; setTimeout(()=>$('#pinIn').focus(),50); }
});
$('#adminX').onclick = ()=>$('#admin').classList.remove('open');
$('#pinGo').onclick = async ()=>{
  sessionStorage.setItem('pods-owner-key', $('#pinIn').value);
  try { await api('/api/me', {auth:true}); $('#pinGate').hidden=true; $('#adminBody').hidden=false; drawAdmin(); }
  catch(e){ sessionStorage.removeItem('pods-owner-key'); $('#pinErr').textContent = 'That key is not right.'; }
};
$('#pinIn').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#pinGo').click(); });

let draft = null;
function compressImage(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, 1400/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
function drawAdmin(){
  draft = structuredClone(G);
  $('#adminBody').innerHTML = `
    <h3>Photo manager</h3>
    <p class="note">Add photos, set their category and crop, then save. Changes show on this browser. Photos are resized automatically.</p>
    <div id="rows">${draft.photos.map((p,i)=>`
      <div class="row">
        <img src="" alt="" data-thumb="${i}" style="background:${imgCss(p.src)} ${esc(p.pos||'center')}/cover">
        <input data-p="photos.${i}.caption" value="${esc(p.caption)}" aria-label="Caption">
        <select data-p="photos.${i}.cat" aria-label="Category">${CATS.map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
        <input data-p="photos.${i}.pos" value="${esc(p.pos||'center')}" placeholder="center 30%" aria-label="Crop position">
        <select data-p="photos.${i}.ar" aria-label="Shape">${['4/5','4/3','1/1','3/4'].map(a=>`<option ${a===(p.ar||'4/5')?'selected':''}>${a}</option>`).join('')}</select>
        <button class="btn danger" data-del="${i}">Remove</button>
      </div>`).join('')}</div>
    <div class="actions">
      <label class="btn primary" style="cursor:pointer">+ Add photo<input type="file" id="addFile" accept="image/*" hidden></label>
      <button class="btn primary" id="saveG">Save</button>
      <span class="msg" id="gMsg"></span>
    </div>`;
  $('#adminBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ collect(); draft.photos.splice(+b.dataset.del,1); drawAdmin(); });
  $('#addFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#gMsg').textContent = 'Adding photo…';
    try { const data = await compressImage(f); const up = await api('/api/upload', {method:'POST', auth:true, body:{data}}); collect(); draft.photos.push({id:'p'+Date.now(), src:up.url, pos:'center', cat:'Pods', caption:'New photo', ar:'4/5'}); drawAdmin(); $('#gMsg').textContent = 'Added. Press Save to publish.'; }
    catch(x){ $('#gMsg').textContent = 'That photo could not be read.'; }
  };
  $('#saveG').onclick = async ()=>{
    collect(); G = draft; const ok = await persist(); renderFilters(); renderGrid(false);
    $('#gMsg').textContent = ok ? 'Saved.' : 'Too much data for this browser. Remove a photo or use smaller ones.';
  };
}
function collect(){
  if (!draft) return;
  $('#adminBody').querySelectorAll('[data-p]').forEach(el=>{
    const parts = el.dataset.p.split('.');
    let o = draft; for (let i=0;i<parts.length-1;i++) o = o[+parts[i]===+parts[i] ? +parts[i] : parts[i]];
    const k = parts[parts.length-1]; o[+k===+k ? +k : k] = el.value;
  });
}

renderFilters(); renderGrid(true);
api('/api/gallery').then(list => { if (Array.isArray(list)) { G.photos = list; renderFilters(); renderGrid(false); } }).catch(()=>{});
</script>
</body>
</html>
